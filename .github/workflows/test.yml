name: Self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ExifTool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libimage-exiftool-perl
      - name: Create test images
        run: bash test/make_testfotos.sh
      - name: Run self-test
        run: |
          python test/check.py | tee ergebnis.txt
          grep -q "FEHLER: keine" ergebnis.txt
